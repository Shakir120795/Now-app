services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # not published to the host in prod — only the api talks to it

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: always
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Gunicorn with uvicorn workers. Tune workers ≈ (2 * cores) + 1.
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app
               --worker-class uvicorn.workers.UvicornWorker
               --workers ${WEB_CONCURRENCY:-4}
               --bind 0.0.0.0:8000
               --timeout 60 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100"
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # mount your TLS cert + key here

volumes:
  pgdata:
  redisdata:
